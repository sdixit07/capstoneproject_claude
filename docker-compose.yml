version: "3.9"
services:
  backend:
    build:
      context: ./ecom-project
      dockerfile: Dockerfile
    environment:
      # Configured for H2 embedded database
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.H2Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Optional: Enable H2 Console in browser if desired
      SPRING_H2_CONSOLE_ENABLED: "true"
      SPRING_H2_CONSOLE_PATH: "/h2-console"
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./ecom-front/ecom-catalog-react
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend